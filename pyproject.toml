[project]
name = "fleetctl"
version = "0.0.1"
description = "Plugin-based fleet management for home devices — device packs, app packs, and declarative workflows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "salvuswarez", email = "60023924+salvuswarez@users.noreply.github.com" },
]
keywords = ["fleet", "device-management", "homeassistant", "adb", "android-tv", "kodi"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "adb-shell>=0.4.4,<0.5",
    "click>=8.1.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/salvuswarez/fleetctl"
Repository = "https://github.com/salvuswarez/fleetctl"
Issues = "https://github.com/salvuswarez/fleetctl/issues"

[project.scripts]
fleetctl = "fleetctl.cli.main:main"

[project.entry-points."fleetctl.packs"]
firetv = "fleetctl.packs.firetv.pack:FireTvPack"
shield = "fleetctl.packs.shield.pack:ShieldPack"

[project.entry-points."fleetctl.apps"]
kodi = "fleetctl.apps.kodi.pack:KodiApp"

[project.optional-dependencies]
mcp = [
    "mcp>=1.2",
]

[dependency-groups]
dev = [
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-pyyaml>=6.0.12.20260724",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetctl"]

[tool.hatch.build.targets.wheel.force-include]
"src/fleetctl/packs" = "fleetctl/packs"

[tool.black]
line-length = 160
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 160
order_by_type = true
ensure_newline_before_comments = true
skip = ["__init__.py"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# FastMCP's decorators are untyped, which is the library's shape rather than
# ours. Relaxed for this binding alone so the rest of the project keeps the
# full strict setting.
[[tool.mypy.overrides]]
module = "fleetctl.mcp.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]
