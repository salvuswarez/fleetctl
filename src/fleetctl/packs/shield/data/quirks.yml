# NVIDIA Shield deviations from stock Android.
#
# VERIFICATION STATUS: confirmed on hardware 2026-08-12 (SHIELD Android TV,
# Android 11, Kodi 21.3), amended 2026-08-14 — see `split_gzip`.
#
# toybox's `tar -z` truncates on CREATE here, exactly as it does on Fire OS.
# This is not Amazon's bug after all; it is toybox's, and both vendors ship it.
# Measured 2026-08-14 over the live Kodi profile:
#
#   tar czf          311,943,168 bytes, exit 0 — 12,263 members then `short read`
#   tar cf + gzip    311,970,606 bytes, exit 0 — 12,896 members, read end to end
#
# The pull is not the culprit and was ruled out rather than assumed: the
# truncated file's md5 matched the device's byte for byte and still failed a
# full read, so the loss is baked in before anything crosses the wire.
#
# This quirk was previously OFF, on the evidence that `tar xzf` restored a
# 160MB build correctly. That reasoning is the trap worth naming: EXTRACT
# working is not evidence CREATE works, and `split_gzip` governs both. A
# restore decompresses an archive gzipped on the host; only a capture asks
# this device's toybox to produce one. Deploy therefore passed for months
# while every capture came back short.
#
# Notably NOT set, each measured rather than assumed:
#   verify_disable_user — VERIFIED HONEST: 15 packages disabled, and all 15
#                       independently confirmed by `pm list packages -d`.
#                       Unlike Fire OS, this device does not silently no-op.
#
# What Android 11 DOES change, handled in shared code rather than here
# because it is a platform version trait and not an NVIDIA one:
#   - /sdcard is a FUSE mount `system_server` cannot read, so an APK must be
#     staged in `apk_staging_dir` (/data/local/tmp) or `pm install` fails
#     with "Can't open file" after a perfectly successful push.
#   - the `tar` here rejects PAX extended headers, so a build archive must be
#     written as GNU (see `_pack_flat`) or extraction aborts partway through
#     the first member on any path over 100 characters.

# Create as `tar` then a separate `gzip`; extract as `gzip -d` then `tar`.
split_gzip: true

# Stream uploads through an on-device listener rather than the ADB push
# protocol. Amended 2026-08-14, and the reason matters because the earlier
# entry recorded the opposite:
#
# This is NOT "native push is broken here" — that was never demonstrated. It
# moved a 160MB build and a 64MB APK intact on 2026-08-12, and the 330MB deploy
# that failed on 2026-08-14 did so on `adb_shell`'s 10s default
# `read_timeout_s` waiting for the device's `OKAY`, not on the transfer. That
# gap is fixed in `_push_native` regardless, so native push would very likely
# work now.
#
# Netcat is chosen on merit instead: 5-12 MB/s measured against ~1 MB/s for the
# push protocol, it is `AdbTransport`'s own default, every Fire TV deploy
# already exercises it, and it removes the ack-timeout class rather than
# widening a window. A 330MB build is where that difference stops being
# academic.
push_via_netcat: true

external_storage: /sdcard
app_data_root: /sdcard/Android/data
disk_headroom: 3.0

# The Shield has considerably faster storage than a stick, but this is a floor
# used only to scale timeouts, so a conservative value costs nothing.
min_unpack_bytes_per_s: 2000000.0
