name: fleet-scan
description: >
  Sweep the home subnet and merge whatever answers into the inventory.
  Devices that are reachable but refuse the key are recorded and flagged
  rather than dropped, so you can see something is there. Override the
  subnet with `--set subnet=...`; nothing else about a known device is
  overwritten, so this is safe to run on a schedule.

steps:
  - id: scan
    use: fleet.scan
    targets: none
    with:
      subnet: 192.168.1.0/24

  # A scan learns what a device *is*; this learns how it's calibrated.
  # Kodi-specific, so it targets only devices tagged for it -- a device
  # without Kodi is skipped rather than probed for a file it hasn't got.
  - id: read-display
    use: kodi.read_display
    targets:
      tags: [kodi]
    concurrency: 4
    on_error: continue
