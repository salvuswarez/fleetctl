# The gold Kodi profile recipe.
#
# This file is the whole reason build is a separate stage: everything that
# shapes what gets deployed lives here as data, so a second profile is a
# second YAML file rather than a fork of the code.

prune_addons:
  # VERIFIED: derived 2026-08-02 from a real capture (Kodi 21.3 on Fire OS
  # 7.7.1.3) rather than invented. An earlier placeholder list here would have
  # deleted the skin, the main content addons and live TV, which is exactly
  # the failure the predecessor hit by carrying a borrowed list forward.
  #
  # This is capture-faithful, NOT curated: it keeps everything that was on the
  # device. Removing an entry is how you prune; do that deliberately, and
  # test the result on a disposable device before it reaches one you rely on.
  allow:
    - plugin.program.autocompletion
    - plugin.program.lazylinks
    - plugin.program.thecrewiz
    - plugin.video.themoviedb.helper
    - plugin.video.umbrella
    - plugin.video.youtube
    - pvr.iptvsimple
    - script.embuary.helper
    - script.embuary.info
    - script.globalsearch
    - script.skinvariables
    - script.texturemaker
    - skin.arctic.fuse.3

  # Dependency and engine categories, kept by prefix. These only provide
  # libraries and services other addons rely on, never a standalone content
  # source, so allowing them wholesale is safe and avoids enumerating every
  # transitive dependency by name.
  allow_prefixes:
    - script.module.
    - service.
    - metadata.
    - resource.
    - inputstream.
    - repository.

apply_settings:
  # VERIFIED: ported from the predecessor's SETTING_OVERRIDES. Every entry
  # here has an incident behind it, recorded inline — none is a preference.
  settings:
    addon_data/skin.arctic.fuse.3/settings.xml:
      # Was `true`: preloaded every home tab's widgets at Kodi startup rather
      # than only the visible one, which contributed to a low-memory kill on
      # a 1.7GB stick.
      startup.enablehubpreloading: "false"

      # Arctic Fuse stores each of these under BOTH a lowercase and a
      # PascalCase key -- an artefact of a skin-version migration -- and reads
      # whichever it finds. Both spellings must be set or the tab keeps its
      # old name.
      homeswitcher.1102.name: "Series"
      HomeSwitcher.1102.Name: "Series"
      HomeSwitcher.1102.Shortcut.label: "Series"
      homeswitcher.1104.name: "Browse"
      HomeSwitcher.1104.Name: "Browse"
      HomeSwitcher.1104.Shortcut.label: "Browse"

      # Hides the Addons tab (slot 1108), leaving Live TV as the last one.
      # The skin gates visibility on `!String.IsEmpty(...)`, so empty is off.
      homeswitcher.1108.toggle: ""

      # script.skinvariables only recompiles home-screen JSON into the skin's
      # rendered includes when this hash changes. Without invalidating it, new
      # hub JSON lands but the compiled includes stay stale even across a
      # restart and a cache clear.
      script-skinvariables-generator-hash: "invalidated-by-deploy"

    addon_data/plugin.video.themoviedb.helper/settings.xml:
      # Concurrent background discover/image threads. The predecessor capped
      # this at 4 as part of a low-memory fix on a 1.7GB stick, alongside the
      # hub-preloading and thumbnail-cache changes below. Set back to the
      # addon default of 10 deliberately (2026-08-02) -- the other two fixes
      # carry most of that weight, and current devices have more headroom. If
      # a memory-pressure crash reappears on a smaller device, this is the
      # first value to drop again.
      max_threads: "10"
      # Trakt was never authenticated in this household, so every scrobble
      # failed silently on every playback.
      trakt_scrobbling: "false"

    addon_data/plugin.video.umbrella/settings.xml:
      # Was `Trakt` with no account authenticated, so every watched/progress
      # lookup failed. This restores the addon's own shipped default.
      indicators: "Local"

    addon_data/plugin.video.thecrew/settings.xml:
      trakt.scrobble: "false"
      # Showed a Trakt list nav entry that cannot load without an account.
      navi.traktlist: "false"

# Kodi's thumbnail cache redirected over network SMB instead of local storage,
# which compounded the low-memory kill above. Removing the substitution
# restores the default local cache.
remove_thumbnail_substitution: {}

# Corrections to the skin's compiled view-type routing. Shipped defaults
# render TV shows and seasons differently depending on whether the content
# came from the library or a plugin; these make both unconditional. Held as
# config because they are skin-version-specific.
apply_view_types:
  includes_path: skin.arctic.fuse.3/1080i/script-skinviewtypes-includes.xml
  expressions:
    Exp_View_505: >-
      [[Container.Content(movies) + [[String.IsEmpty(Container.PluginName) |  String.IsEqual(Container.PluginName,plugin.video.themoviedb.helper)] |  [!String.IsEmpty(Container.PluginName)]]] | [Container.Content(tvshows)]]
    Exp_View_521: >-
      [Container.Content() + String.IsEqual(Container.Property(param.info),watch_providers) +  [!String.IsEmpty(Container.PluginName)]]
    Exp_View_524: >-
      [[Container.Content(sets) + [[String.IsEmpty(Container.PluginName)] | [!String.IsEmpty(Container.PluginName)]]] |  [Container.Content(seasons)] |  [Container.Content(videoversions) + [[String.IsEmpty(Container.PluginName)] | [!String.IsEmpty(Container.PluginName)]]] |  [!Window.IsVisible(MyMusicNav.xml) + Container.Content(genres) + [[String.IsEmpty(Container.PluginName)] | [!String.IsEmpty(Container.PluginName)]]] |  [Container.Content(studios) + [[String.IsEmpty(Container.PluginName)] | [!String.IsEmpty(Container.PluginName)]]] |  [Container.Content(playlists) + [String.IsEmpty(Container.PluginName)]] |  [Container.Content() + String.IsEqual(Container.Property(param.info),watch_providers) + [String.IsEmpty(Container.PluginName)]]]

# Home-screen hubs, generated from data/hubs/<layout>.yml so the widget rows
# and the TMDbHelper nodes behind them cannot disagree.
apply_hub_layout:
  layout: arctic-fuse-3
