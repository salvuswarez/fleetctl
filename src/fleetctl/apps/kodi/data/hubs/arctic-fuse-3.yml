# Arctic Fuse 3 home-screen layout.
#
# Three config layers drive this skin's home screen and they drift apart by
# hand: HomeSwitcher slots (skin settings), skinvariables widget/submenu JSON,
# and TMDbHelper node JSON. Generating the latter two from this one file is
# the point — a captured gold config had Movies showing seven rows as a node
# and four as widgets, so browsing into a hub showed different content than
# its home rows advertised. Spotlights and hub names are skin settings, set in
# `profiles/gold.yml` alongside this.
#
# Each hub answers one question, and Movies and Series share one skeleton so
# learning one teaches the other:
#   Home      what do I watch now?   personal rows only, library first
#   Movies    what movies are there? resume, library, new, popular, browse
#   Series    what series are there? the same, plus next up and networks
#   Discover  find something new     trending, the last year, international
# 1106 Next Aired (the skin's own calendar) answers "when is my show on?".
#
# Labels stay at 15 characters or fewer: the row strip cuts anything longer
# at 1080p ("Continue Watchi…"), and two rows differing only in a suffix
# become indistinguishable.
#
# `row_groups` exists so a group used twice is defined once: YAML anchors give
# the same no-drift property the predecessor got from calling one function
# twice.
#
# Slot 1104 was a flat wall of ten live TMDb queries with no submenu and no
# local content, and reproducibly preceded an OOM kill on a 1.7GB stick. Keep
# its live rows few.
#
# Slots deliberately absent: 1103 (hand-curated), 1107 (Live TV), 1108
# (Addons, disabled in the profile settings).
#
# A row may be:
#   `path`      a literal path (library smartlist, another addon)
#   `discover`  TMDbHelper's discover route with filters
#   `tmdb`      any TMDbHelper list route by name (`info`) with its params
#   `chips`     a row of chips plus a preview row of the focused chip
# and may set `style` (Poster, Landscape, Square, Board, Circle, Card, Banner).

# TMDbHelper ships no `white` icon set; rows that referenced one rendered
# without an icon. The skin's own set is large and always present.
icons:
  tmdb: special://home/addons/plugin.video.themoviedb.helper/resources/icons/themoviedb
  skin: special://skin/extras/icons

# Kodi library smartlists: local, instant, no network round-trip. Every hub
# leads with these so something renders before any TMDb call resolves.
library:
  tv_progress: &lib_tv_progress library://video/tvshows/inprogressshows.xml/
  movie_progress: &lib_movie_progress library://video/movies/inprogressmovies.xml/
  movie_recent: &lib_movie_recent library://video/movies/recentlyaddedmovies.xml/

# script.embuary.helper 2.0.8 library lists, none needing Trakt. `type` is the
# helper's own: `mixed` returns movies and episodes together, which no Kodi
# smartlist can, since a smartlist holds one media type.
embuary:
  in_progress: &emb_in_progress plugin://script.embuary.helper/?info=getinprogress&type=mixed
  next_up: &emb_next_up plugin://script.embuary.helper/?info=getnextup&type=tvshow
  new_episodes: &emb_new_episodes plugin://script.embuary.helper/?info=getnewshows&type=tvshow
  # Similar to a random one of the last ten movies watched.
  similar_movies: &emb_similar_movies plugin://script.embuary.helper/?info=getsimilar&type=movie

# Discover filters used by more than one row under different labels. A row
# group shares a whole list; this shares one row's query.
filters:
  tv_crime_docs_mystery: &tv_crime_docs_mystery {tmdb_type: tv, with_genres: "80%7C9648%7C99", sort_by: popularity.desc, vote_count.gte: 100}

# Genre, network and company ids are TMDb's own. %7C is a URL-encoded pipe (OR).
row_groups:
  movie_genres: &movie_genres
    - label: Action & Adventure
      icon: "{tmdb}/movies.png"
      discover: {tmdb_type: movie, with_genres: "28%7C12", sort_by: popularity.desc, vote_count.gte: 500}
    - label: Comedy
      icon: "{tmdb}/movies.png"
      discover: {tmdb_type: movie, with_genres: 35, sort_by: popularity.desc, vote_count.gte: 300}
    - label: Sci-Fi
      icon: "{tmdb}/movies.png"
      discover: {tmdb_type: movie, with_genres: 878, sort_by: popularity.desc, vote_count.gte: 200}
    - label: Thriller
      icon: "{tmdb}/movies.png"
      discover: {tmdb_type: movie, with_genres: 53, sort_by: popularity.desc, vote_count.gte: 200}
    - label: Horror
      icon: "{tmdb}/movies.png"
      discover: {tmdb_type: movie, with_genres: 27, sort_by: popularity.desc, vote_count.gte: 100}
    - label: Family
      icon: "{tmdb}/movies.png"
      discover: {tmdb_type: movie, with_genres: 10751, sort_by: popularity.desc, vote_count.gte: 100}
    - label: Drama
      icon: "{tmdb}/movies.png"
      discover: {tmdb_type: movie, with_genres: 18, sort_by: popularity.desc, vote_count.gte: 300}
    - label: Crime & Mystery
      icon: "{tmdb}/movies.png"
      discover: {tmdb_type: movie, with_genres: "80%7C9648%7C99", sort_by: popularity.desc, vote_count.gte: 100}

  tv_genres: &tv_genres
    - label: Drama
      icon: "{tmdb}/tv.png"
      discover: {tmdb_type: tv, with_genres: 18, sort_by: popularity.desc, vote_count.gte: 100}
    - label: Comedy
      icon: "{tmdb}/tv.png"
      discover: {tmdb_type: tv, with_genres: 35, sort_by: popularity.desc, vote_count.gte: 100}
    - label: Crime & Mystery
      icon: "{tmdb}/tv.png"
      discover: *tv_crime_docs_mystery
    - label: Sci-Fi & Fantasy
      icon: "{tmdb}/tv.png"
      discover: {tmdb_type: tv, with_genres: 10765, sort_by: popularity.desc, vote_count.gte: 100}
    - label: Animation
      icon: "{tmdb}/tv.png"
      discover: {tmdb_type: tv, with_genres: 16, sort_by: popularity.desc, vote_count.gte: 50}
    - label: Reality
      icon: "{tmdb}/genre.png"
      discover: {tmdb_type: tv, with_genres: 10764, sort_by: popularity.desc, vote_count.gte: 20}
    - label: Documentary
      icon: "{tmdb}/genre.png"
      discover: {tmdb_type: tv, with_genres: 99, sort_by: popularity.desc, vote_count.gte: 20}

  # The captured config had this group's icon pointing at a repository .zip
  # URL — a paste error that can never resolve as an image.
  # Network ids added 2026-10-21 were checked against TMDb's public
  # /network/<id> pages: Prime Video 1024, Peacock 3353, FX 88, AMC 174,
  # Showtime 67, Adult Swim 80.
  networks: &networks
    - label: Netflix
      icon: "{tmdb}/discover.png"
      discover: {tmdb_type: tv, with_networks: 213, sort_by: popularity.desc}
    - label: HBO / Max
      icon: "{tmdb}/discover.png"
      discover: {tmdb_type: tv, with_networks: "49%7C3186", sort_by: popularity.desc}
    - label: Prime Video
      icon: "{tmdb}/discover.png"
      discover: {tmdb_type: tv, with_networks: 1024, sort_by: popularity.desc}
    - label: Apple TV+
      icon: "{tmdb}/discover.png"
      discover: {tmdb_type: tv, with_networks: 2552, sort_by: popularity.desc}
    - label: Disney+
      icon: "{tmdb}/discover.png"
      discover: {tmdb_type: tv, with_networks: 2739, sort_by: popularity.desc}
    - label: Hulu
      icon: "{tmdb}/discover.png"
      discover: {tmdb_type: tv, with_networks: 453, sort_by: popularity.desc}
    - label: Paramount+
      icon: "{tmdb}/discover.png"
      discover: {tmdb_type: tv, with_networks: 4330, sort_by: popularity.desc}
    - label: Peacock
      icon: "{tmdb}/discover.png"
      discover: {tmdb_type: tv, with_networks: 3353, sort_by: popularity.desc}
    - label: FX
      icon: "{tmdb}/discover.png"
      discover: {tmdb_type: tv, with_networks: 88, sort_by: popularity.desc}
    - label: AMC
      icon: "{tmdb}/discover.png"
      discover: {tmdb_type: tv, with_networks: 174, sort_by: popularity.desc}
    - label: Showtime
      icon: "{tmdb}/discover.png"
      discover: {tmdb_type: tv, with_networks: 67, sort_by: popularity.desc}
    - label: Adult Swim
      icon: "{tmdb}/discover.png"
      discover: {tmdb_type: tv, with_networks: 80, sort_by: popularity.desc}

  # TMDb has no network filter for movies — a network is a TV concept there.
  # The movie equivalent is "streaming on", which is watch-provider
  # availability and needs a region. TMDbHelper's own Where to Watch menus
  # build this same URL. Provider ids are TMDb's, not its network ids, and
  # were not verifiable without an API key: an empty row on the device is the
  # sign one is wrong. Paramount+ and Peacock are the likeliest to have moved,
  # since TMDb now lists them as Premium/Essential tiers.
  movie_networks: &movie_networks
    - label: Netflix
      icon: "{tmdb}/discover.png"
      discover: {tmdb_type: movie, with_watch_providers: 8, watch_region: US, sort_by: popularity.desc}
    - label: HBO / Max
      icon: "{tmdb}/discover.png"
      discover: {tmdb_type: movie, with_watch_providers: 1899, watch_region: US, sort_by: popularity.desc}
    - label: Prime Video
      icon: "{tmdb}/discover.png"
      discover: {tmdb_type: movie, with_watch_providers: 9, watch_region: US, sort_by: popularity.desc}
    - label: Apple TV+
      icon: "{tmdb}/discover.png"
      discover: {tmdb_type: movie, with_watch_providers: 350, watch_region: US, sort_by: popularity.desc}
    - label: Disney+
      icon: "{tmdb}/discover.png"
      discover: {tmdb_type: movie, with_watch_providers: 337, watch_region: US, sort_by: popularity.desc}
    - label: Hulu
      icon: "{tmdb}/discover.png"
      discover: {tmdb_type: movie, with_watch_providers: 15, watch_region: US, sort_by: popularity.desc}
    - label: Paramount+
      icon: "{tmdb}/discover.png"
      discover: {tmdb_type: movie, with_watch_providers: 531, watch_region: US, sort_by: popularity.desc}
    - label: Peacock
      icon: "{tmdb}/discover.png"
      discover: {tmdb_type: movie, with_watch_providers: 386, watch_region: US, sort_by: popularity.desc}

  # K-Dramas and Anime go by origin country plus genre: TMDb has no network
  # id for either as a category. ABS-CBN sorts by air date, not popularity,
  # so new teleseryes lead rather than the long-running ones.
  international: &international
    - label: K-Dramas
      icon: "{tmdb}/tv.png"
      discover: {tmdb_type: tv, sort_by: popularity.desc, with_origin_country: KR, vote_count.gte: 50}
    - label: Anime
      icon: "{tmdb}/tv.png"
      discover: {tmdb_type: tv, with_genres: 16, sort_by: popularity.desc, with_origin_country: JP, vote_count.gte: 50}
    - label: ABS-CBN
      icon: "{tmdb}/discover.png"
      discover: {tmdb_type: tv, with_networks: 156, sort_by: first_air_date.desc}
    - label: GMA
      icon: "{tmdb}/discover.png"
      discover: {tmdb_type: tv, with_networks: 210, sort_by: popularity.desc}
    - label: Viu
      icon: "{tmdb}/discover.png"
      discover: {tmdb_type: tv, with_networks: 1510, sort_by: popularity.desc}

  # What came out in the last year, as one place to look. Rolling rather than
  # calendar-year: TMDbHelper resolves only day offsets (`T-365`), so "since
  # January 1st" would need the year baked in at build and would go stale
  # every January until the next build.
  past_year: &past_year
    - label: Movies
      icon: "{tmdb}/intheatres.png"
      discover: {tmdb_type: movie, sort_by: popularity.desc, vote_count.gte: 25, primary_release_date.gte: T-365, primary_release_date.lte: T-0}
    - label: New Series
      icon: "{tmdb}/trending.png"
      discover: {tmdb_type: tv, sort_by: popularity.desc, vote_count.gte: 10, first_air_date.gte: T-365, first_air_date.lte: T-0}
    # Any episode aired in the window, from a series that premiered before it:
    # the same split "Airing Now" makes, over a year.
    - label: Returning Series
      icon: "{tmdb}/trending.png"
      discover: {tmdb_type: tv, sort_by: popularity.desc, vote_count.gte: 50, first_air_date.lte: T-365, air_date.gte: T-365, air_date.lte: T-0}

  movie_decades: &movie_decades
    - label: 2020s
      icon: "{tmdb}/movies.png"
      discover: {tmdb_type: movie, sort_by: popularity.desc, vote_count.gte: 200, primary_release_date.gte: "2020-01-01", primary_release_date.lte: "2029-12-31"}
    - label: 2010s
      icon: "{tmdb}/movies.png"
      discover: {tmdb_type: movie, sort_by: popularity.desc, vote_count.gte: 200, primary_release_date.gte: "2010-01-01", primary_release_date.lte: "2019-12-31"}
    - label: 2000s
      icon: "{tmdb}/movies.png"
      discover: {tmdb_type: movie, sort_by: popularity.desc, vote_count.gte: 200, primary_release_date.gte: "2000-01-01", primary_release_date.lte: "2009-12-31"}
    - label: 1990s
      icon: "{tmdb}/movies.png"
      discover: {tmdb_type: movie, sort_by: popularity.desc, vote_count.gte: 200, primary_release_date.gte: "1990-01-01", primary_release_date.lte: "1999-12-31"}
    - label: Before 1990
      icon: "{tmdb}/movies.png"
      discover: {tmdb_type: movie, sort_by: popularity.desc, vote_count.gte: 200, primary_release_date.gte: "1900-01-01", primary_release_date.lte: "1989-12-31"}

  # The same cut-offs as movies, so "1990s" means the same thing in both hubs.
  tv_decades: &tv_decades
    - label: 2020s
      icon: "{tmdb}/tv.png"
      discover: {tmdb_type: tv, sort_by: popularity.desc, vote_count.gte: 100, first_air_date.gte: "2020-01-01", first_air_date.lte: "2029-12-31"}
    - label: 2010s
      icon: "{tmdb}/tv.png"
      discover: {tmdb_type: tv, sort_by: popularity.desc, vote_count.gte: 100, first_air_date.gte: "2010-01-01", first_air_date.lte: "2019-12-31"}
    - label: 2000s
      icon: "{tmdb}/tv.png"
      discover: {tmdb_type: tv, sort_by: popularity.desc, vote_count.gte: 100, first_air_date.gte: "2000-01-01", first_air_date.lte: "2009-12-31"}
    - label: 1990s
      icon: "{tmdb}/tv.png"
      discover: {tmdb_type: tv, sort_by: popularity.desc, vote_count.gte: 100, first_air_date.gte: "1990-01-01", first_air_date.lte: "1999-12-31"}
    - label: Before 1990
      icon: "{tmdb}/tv.png"
      discover: {tmdb_type: tv, sort_by: popularity.desc, vote_count.gte: 100, first_air_date.gte: "1900-01-01", first_air_date.lte: "1989-12-31"}

  # Defined once here and reached three ways: each hub's Collections menu and
  # Discover's Top Rated / Hidden Gems menus, the latter relabelled by merge key.
  #
  # 8.0, not 9.0: TMDb's best-rated movies with any real vote count top out
  # near 8.7, so a 9.0 floor returned an empty row. The label used to say
  # "90%+"; it now promises nothing the threshold does not deliver.
  movie_collections: &movie_collections
    - &top_rated_movies
      label: Top Rated
      icon: "{tmdb}/popular.png"
      discover: {tmdb_type: movie, sort_by: popularity.desc, vote_average.gte: 8.0, vote_count.gte: 2000}
    - &hidden_gem_movies
      label: Hidden Gems
      icon: "{tmdb}/movies.png"
      discover: {tmdb_type: movie, sort_by: vote_average.desc, vote_count.gte: 50, vote_count.lte: 400}
    - label: Crime & Thriller
      icon: "{tmdb}/movies.png"
      discover: {tmdb_type: movie, with_genres: "80%7C53", sort_by: popularity.desc, vote_count.gte: 100}
    - label: Marvel
      icon: "{tmdb}/movies.png"
      discover: {tmdb_type: movie, with_companies: 420, sort_by: primary_release_date.desc}
    - label: Pixar
      icon: "{tmdb}/movies.png"
      discover: {tmdb_type: movie, with_companies: 3, sort_by: primary_release_date.desc}
    - label: A24
      icon: "{tmdb}/movies.png"
      discover: {tmdb_type: movie, with_companies: 41077, sort_by: primary_release_date.desc}
    - label: Studio Ghibli
      icon: "{tmdb}/movies.png"
      discover: {tmdb_type: movie, with_companies: 10342, sort_by: primary_release_date.desc}

  tv_collections: &tv_collections
    - &top_rated_series
      label: Top Rated
      icon: "{tmdb}/popular.png"
      discover: {tmdb_type: tv, sort_by: popularity.desc, vote_average.gte: 8.0, vote_count.gte: 500}
    - &hidden_gem_series
      label: Hidden Gems
      icon: "{tmdb}/tv.png"
      discover: {tmdb_type: tv, sort_by: vote_average.desc, vote_count.gte: 20, vote_count.lte: 200}

  top_rated: &top_rated
    - {<<: *top_rated_movies, label: Movies}
    - {<<: *top_rated_series, label: Series}

  hidden_gems: &hidden_gems
    - {<<: *hidden_gem_movies, label: Movies}
    - {<<: *hidden_gem_series, label: Series}

hubs:
  home:
    node: home_hub.json
    node_name: HOME
    widgets:
      - {label: Continue, icon: "{skin}/clock-rotate-left.png", path: *emb_in_progress, style: Landscape}
      - {label: Next Up, icon: "{skin}/clock-rotate-left.png", path: *emb_next_up, style: Landscape}
      - {label: New Episodes, icon: "{skin}/calendar.png", path: *emb_new_episodes, style: Landscape}
      - {label: Added Movies, icon: "{skin}/calendar.png", path: *lib_movie_recent, style: Poster}
      # Series already on air, as opposed to "New Series" in the Series hub,
      # which is series that debuted recently. TMDb has no season-premiere
      # filter: `air_date` matches any episode airing in the window, so a show
      # mid-season qualifies too. `first_air_date.lte: T-90` is what keeps
      # brand-new series out. Defined here once and aliased into the Series hub
      # so the two cannot drift.
      - &airing_now
        label: Airing Now
        icon: "{tmdb}/trending.png"
        style: Poster
        discover:
          tmdb_type: tv
          sort_by: popularity.desc
          with_original_language: en
          vote_count.gte: 50
          first_air_date.lte: T-90
          air_date.gte: T-0
          # %2B is a URL-encoded plus; a bare one reads back as a space ("T 14").
          air_date.lte: T%2B14
      - {label: You Might Like, icon: "{tmdb}/discover.png", path: *emb_similar_movies, style: Poster}
      # Series > Crime & Mystery, surfaced on home. The filter is that row's
      # own, by anchor: a hand copy had dropped documentaries.
      - {label: Maddy's Picks, icon: "{tmdb}/discover.png", discover: *tv_crime_docs_mystery, style: Poster}
    submenu: []

  "1101":
    node: movies_hub_main.json
    node_name: MOVIES
    widgets:
      - {label: Resume Movies, icon: "{skin}/clock-rotate-left.png", path: *lib_movie_progress, style: Landscape}
      - {label: Added Movies, icon: "{skin}/calendar.png", path: *lib_movie_recent, style: Poster}
      - label: New Releases
        icon: "{tmdb}/intheatres.png"
        style: Poster
        discover: {tmdb_type: movie, sort_by: primary_release_date.desc, with_original_language: en, vote_count.gte: 25, primary_release_date.lte: T-0}
      - {label: Popular, icon: "{tmdb}/popular.png", style: Poster, tmdb: {info: popular, tmdb_type: movie}}
      - {label: Genres, icon: "{skin}/genre.png", chips: *movie_genres}
      - {label: Streaming On, icon: "{skin}/rocket.png", chips: *movie_networks}
      - {label: Coming Soon, icon: "{tmdb}/intheatres.png", style: Poster, tmdb: {info: upcoming, tmdb_type: movie}}
    submenu:
      - {label: By Decade, icon: "{skin}/calendar.png", rows: *movie_decades}
      - {label: Collections, icon: "{skin}/genre.png", rows: *movie_collections}

  "1102":
    node: tv_hub_main.json
    node_name: SERIES
    widgets:
      - {label: Resume Series, icon: "{skin}/clock-rotate-left.png", path: *lib_tv_progress, style: Landscape}
      - {label: Next Up, icon: "{skin}/clock-rotate-left.png", path: *emb_next_up, style: Landscape}
      - {label: New Episodes, icon: "{skin}/calendar.png", path: *emb_new_episodes, style: Landscape}
      - label: New Series
        icon: "{tmdb}/trending.png"
        style: Poster
        discover:
          tmdb_type: tv
          sort_by: first_air_date.desc
          with_original_language: en
          vote_count.gte: 5
          first_air_date.lte: T-0
          first_air_date.gte: T-90
      - *airing_now
      - {label: Popular, icon: "{tmdb}/popular.png", style: Poster, tmdb: {info: popular, tmdb_type: tv}}
      - {label: Genres, icon: "{skin}/genre.png", chips: *tv_genres}
      - {label: Networks, icon: "{skin}/rocket.png", chips: *networks}
    submenu:
      - {label: International, icon: "{skin}/genre.png", rows: *international}
      - {label: By Decade, icon: "{skin}/calendar.png", rows: *tv_decades}
      - {label: Collections, icon: "{skin}/genre.png", rows: *tv_collections}

  # Discover: find something new. Its live rows stay few (see the 1104 OOM
  # note above): two trending rows plus one preview per chip row, six in all,
  # against the ten that preceded the crash. Everything here is on screen, so
  # it needs no sub-menu.
  "1104":
    node: genres_hub.json
    node_name: DISCOVER
    widgets:
      - {label: Trending Movies, icon: "{tmdb}/trending.png", style: Poster, tmdb: {info: trending_week, tmdb_type: movie}}
      - {label: Trending Series, icon: "{tmdb}/trending.png", style: Poster, tmdb: {info: trending_week, tmdb_type: tv}}
      - {label: Past 12 Months, icon: "{skin}/calendar.png", chips: *past_year}
      - {label: Top Rated, icon: "{skin}/genre.png", chips: *top_rated}
      - {label: Hidden Gems, icon: "{skin}/genre.png", chips: *hidden_gems}
      - {label: International, icon: "{skin}/genre.png", chips: *international}
    submenu: []
