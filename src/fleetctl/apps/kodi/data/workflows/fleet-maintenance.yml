name: fleet-maintenance
description: >
  Debloat, apply performance settings and trim caches across the fleet,
  touching no Kodi profile. Safe to run on a schedule.

steps:
  - id: maintain-firetv
    use: firetv.maintain
    targets:
      type: firetv
    concurrency: 4
    on_error: continue

  - id: maintain-shield
    use: shield.maintain
    targets:
      type: shield
    concurrency: 2
    on_error: continue

  # Reclaims space rather than debloating: SteamOS ships nothing to disable,
  # and its root filesystem is read-only.
  - id: maintain-steamdeck
    use: steamdeck.maintain
    targets:
      type: steamdeck
    concurrency: 1
    on_error: continue
