name: kodi-refresh
description: >
  The full roll-out: fetch the newest stable Kodi, rebuild the profile from
  the latest capture, then bring every Kodi device up to both. Maintenance
  runs before deployment so a device is trimmed before it receives a profile.

steps:
  # Fleet-level: publishes an artifact, touches no device.
  - id: fetch-base
    use: kodi.fetch_base
    targets: none
    on_error: continue

  # Also fleet-level. Handed a transform chain and no transport, so it
  # structurally cannot reach a device.
  - id: build
    use: kodi.build
    targets: none

  # One unreachable device must not stop the rest of the fleet.
  - id: maintain
    use: firetv.maintain
    targets:
      tags: [kodi]
      type: firetv
    concurrency: 4
    on_error: continue

  # Skipped per-device when the device already runs the published version.
  - id: install-kodi
    use: kodi.install_base
    targets:
      tags: [kodi]
    concurrency: 2
    on_error: continue

  # Picks up the newest build by querying the artifact store, which is why no
  # value has to be threaded from the build step above.
  - id: deploy
    use: kodi.deploy
    targets:
      tags: [kodi]
    concurrency: 2
    on_error: continue

  # A build is one artifact for the whole fleet, so anything that differs per
  # device is reapplied here -- the restored profile overwrote it.
  - id: device-config
    use: kodi.apply_device_config
    targets:
      tags: [kodi]
    concurrency: 2
    on_error: continue
